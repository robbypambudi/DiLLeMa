# Disposable test database only. No persistent volume or application data mounts.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kg_test
      POSTGRES_PASSWORD: kg_test_local_only
      POSTGRES_DB: kg_test
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kg_test -d kg_test"]
      interval: 2s
      timeout: 3s
      retries: 30
